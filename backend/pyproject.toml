[project]
name = "docent"
version = "0.1.0"
description = "RAG over technical documentation with cited answers"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.0",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "langchain-pinecone>=0.2",
  "pinecone>=7",
  "pypdf>=5",
  "numpy>=1.26",
  "openai>=1.50",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["fastembed>=0.5"]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
